[project]
name = "opendota-mcp-server"
version = "2.0.0"
description = "MCP server for the OpenDota API: ask about Dota 2 players, matches and heroes in natural language"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "hkaanengin" }]
keywords = ["mcp", "opendota", "dota2", "fastmcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=4,<5",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
]

[project.scripts]
opendota-mcp-server = "opendota_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=9",
    "pytest-asyncio>=1.2",
    "respx>=0.22",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendota_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml", "uv.lock"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
