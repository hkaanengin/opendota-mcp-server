# Hero Nicknames: community shorthand that isn't a spelling of the hero's name.
#
# Each key is a hero's internal name (OpenDota `/constants/heroes` `name` without the
# `npc_dota_hero_` prefix); each value lists its nicknames. Matching ignores case,
# spaces and punctuation, so "Mag-ina" finds "magina". Typos of real names need no
# entry: they are matched by spelling.
#
# A nickname belongs to exactly one hero. Shorthand the community uses for several
# heroes goes in [ambiguous] at the end, and the tool asks which hero was meant.

alchemist = ["alch"]
ancient_apparition = ["aa"]
antimage = ["am", "magina"]
arc_warden = ["arc", "zet"]
batrider = ["bat"]
beastmaster = ["bm"]
bloodseeker = ["bs"]
