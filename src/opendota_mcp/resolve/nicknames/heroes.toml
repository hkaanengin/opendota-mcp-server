death_prophet = ["dp"]
dragon_knight = ["dk"]
drow_ranger = ["drow", "traxex"]
earth_spirit = ["kaolin"]
elder_titan = ["et"]
ember_spirit = ["ember", "xin"]
enchantress = ["ench"]
