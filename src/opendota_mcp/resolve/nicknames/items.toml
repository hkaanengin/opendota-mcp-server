# Item Nicknames: community shorthand that isn't a spelling of the item's name.
#
# Each key is an item's internal name (its key in OpenDota `/constants/items`); each
# value lists its nicknames. Matching ignores case, spaces and punctuation. Typos of
# real names need no entry: they are matched by spelling. A nickname belongs to
# exactly one item.

